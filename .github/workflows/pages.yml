name: Test and deploy map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test API schema and map filters
        run: npm test
      - name: Check browser JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/model.js
          node --check dist/config.js
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload map assets
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
